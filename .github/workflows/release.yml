name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android workflow run
        required: true
      source_sha:
        description: Expected tested source commit
        required: true
      tag:
        description: Existing draft release tag
        required: true
        default: v1.0.1
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: ${{ inputs.run_id }}
      EXPECTED_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify successful build provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$EXPECTED_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Download verified APK and AAB
        run: gh run download "$VERIFIED_RUN" --name my-salon-apk-aab --dir verified-build
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          version="${RELEASE_TAG#v}"
          cp verified-build/apk/debug/app-debug.apk "dist/my-salon-$version.apk"
          cp verified-build/bundle/release/app-release.aab "dist/my-salon-$version-unsigned.aab"
          cd dist
          sha256sum "my-salon-$version.apk" "my-salon-$version-unsigned.aab" > SHA256SUMS.txt
      - name: Attach assets and publish MVP release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "dist/my-salon-$version.apk" "dist/my-salon-$version-unsigned.aab" dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          gh release view "$RELEASE_TAG" --json url,assets
